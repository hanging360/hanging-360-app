name: Capacitor Sync

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cap-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Commit synced native changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: cap sync [skip ci]'
          file_pattern: 'ios/** android/**'
          commit_user_name: 'lovable-cap-sync[bot]'
          commit_user_email: 'lovable-cap-sync@users.noreply.github.com'