workflows:
  capacitor_ios_release:
    name: Capacitor iOS Release
    max_build_duration: 120

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hanging360.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hanging360.app"
        DEVELOPMENT_TEAM: "C427U3735D"
        MARKETING_VERSION: "0.4"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Developer/Xcode/DerivedData/**/SourcePackages

    scripts:
      - name: Validate toolchain
        script: |
          node -v
          npm -v
          xcodebuild -version

      - name: Validate signing assets
        script: |
          echo "=== Installed code signing identities ==="
          security find-identity -v -p codesigning || true
          echo "=== Installed provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Install JS dependencies
        script: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Verify notification plugins
        script: |
          cd ios/App
          grep -E "CapacitorPushNotifications|CapacitorLocalNotifications|CapacitorApp|CapawesomeCapacitorBadge" CapApp-SPM/Package.swift \
            || (echo "Missing notification plugins in Package.swift" && exit 1)
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || true
          cd ../..

      - name: Force Bundle ID and version
        script: |
          sed -i '' 's/com.hanging360.tech/com.hanging360.app/g' ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' 's/com.it2fixsupport.pwacapacitorwrapper/com.hanging360.app/g' ios/App/App.xcodeproj/project.pbxproj || true
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION" || true
          agvtool new-version -all "$BUILD_NUMBER" || true
          cd ../..

      - name: Initialize keychain
        script: keychain initialize

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        script: xcode-project use-profiles

      - name: Show code signing settings
        script: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings | egrep "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --verbose

      - name: Print xcodebuild logs
        script: |
          echo "=== xcodebuild logs ==="
          find /tmp/xcodebuild_logs -type f -name "*.log" -maxdepth 2 -print || true
          tail -n 300 /tmp/xcodebuild_logs/*.log || true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      email:
        recipients:
          - cubanito_com@yahoo.com
        notify:
          success: true
          failure: true

  capacitor_android_release:
    name: Capacitor Android Release
    max_build_duration: 120

    environment:
      java: 21
      node: 20
      vars:
        PACKAGE_NAME: "com.hanging360.app"
        VERSION_NAME: "0.4"
      android_signing:
        - hanging360_keystore

    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
        - android/.gradle

    scripts:
      - name: Validate toolchain
        script: |
          node -v
          npm -v
          java -version

      - name: Install JS dependencies
        script: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Verify notification plugins
        script: |
          grep -E "capacitor-push-notifications|capacitor-local-notifications|capacitor-app|capawesome.*badge" \
            android/capacitor.settings.gradle android/app/capacitor.build.gradle \
            || (echo "Missing notification plugin refs in gradle" && exit 1)

      - name: Build signed AAB + APK
        script: |
          cd android
          ./gradlew clean
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -PversionName=$VERSION_NAME \
            -PversionCode=$BUILD_NUMBER

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - cubanito_com@yahoo.com
        notify:
          success: true
          failure: true
