workflows:
  capacitor_android_release:
    name: Capacitor Android Release
    max_build_duration: 120

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      java: 21
      node: 20
      vars:
        PACKAGE_NAME: "com.hanging360.app"
        VERSION_NAME: "4"
      android_signing:
        - hanging360_keystore_v2

    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
        - android/.gradle

    scripts:
      - name: Validate toolchain
        script: |
          node -v
          npm -v
          java -version

      - name: Install JS dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Force applicationId and version
        script: |
          sed -i 's/com.hanging360.tech/com.hanging360.app/g' android/app/build.gradle || true
          sed -i 's/com.hanging360.tech/com.hanging360.app/g' android/app/src/main/res/values/strings.xml || true
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle || true
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" android/app/build.gradle || true
          echo "=== build.gradle after overrides ==="
          grep -E "applicationId|namespace|versionName|versionCode" android/app/build.gradle || true

      - name: Verify notification plugins
        script: |
          grep -E "capacitor-push-notifications|capacitor-local-notifications|capacitor-app|capawesome.*badge" \
            android/capacitor.settings.gradle android/app/capacitor.build.gradle \
            || (echo "Missing notification plugin refs in gradle" && exit 1)

      - name: Build signed AAB + APK
        script: |
          cd android
          ./gradlew clean
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -PversionName=$VERSION_NAME \
            -PversionCode=$BUILD_NUMBER

      - name: Verify AAB artifact
        script: |
          echo "=== Listing release outputs ==="
          ls -la android/app/build/outputs/bundle/release/ || true
          ls -la android/app/build/outputs/apk/release/ || true
          if ! ls android/app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then
            echo "ERROR: No AAB produced in android/app/build/outputs/bundle/release/"
            exit 1
          fi
          echo "AAB generated successfully."

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - cubanito_com@yahoo.com
        notify:
          success: true
          failure: true

  capacitor_ios_release:
    name: Capacitor iOS Release
    max_build_duration: 120

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hanging360.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hanging360.app"
        DEVELOPMENT_TEAM: "C427U3735D"
        MARKETING_VERSION: "0.4"
        PROVISIONING_PROFILE_NAME: "Hanging360 App Store"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Developer/Xcode/DerivedData/**/SourcePackages

    scripts:
      - name: Validate toolchain
        script: |
          node -v
          npm -v
          xcodebuild -version

      - name: Validate signing assets
        script: |
          echo "=== Installed code signing identities ==="
          security find-identity -v -p codesigning || true
          echo "=== Installed provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Install JS dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Verify notification plugins
        script: |
          cd ios/App
          grep -E "CapacitorPushNotifications|CapacitorLocalNotifications|CapacitorApp|CapawesomeCapacitorBadge" CapApp-SPM/Package.swift \
            || (echo "Missing notification plugins in Package.swift" && exit 1)
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || true
          cd ../..

      - name: Preflight SPM resolve
        script: |
          mkdir -p /tmp/xcodebuild_logs
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath /tmp/spm 2>&1 | tee /tmp/xcodebuild_logs/spm.log

      - name: Force Bundle ID and version
        script: |
          sed -i '' 's/com.hanging360.tech/com.hanging360.app/g' ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' 's/com.it2fixsupport.pwacapacitorwrapper/com.hanging360.app/g' ios/App/App.xcodeproj/project.pbxproj || true
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION" || true
          agvtool new-version -all "$BUILD_NUMBER" || true
          cd ../..

      - name: Initialize keychain
        script: keychain initialize

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        script: xcode-project use-profiles

      - name: Show code signing settings
        script: |
          echo "PROVISIONING_PROFILE_NAME=$PROVISIONING_PROFILE_NAME"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings | egrep "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY"

      - name: Build signed IPA
        ignore_failure: true
        script: |
          mkdir -p /tmp/xcodebuild_logs build/ios/xcarchive
          set -o pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          echo "=== Running xcodebuild archive (full log at /tmp/xcodebuild_logs/archive.log) ==="
          if ! xcodebuild \
                -project "$XCODE_PROJECT" \
                -scheme "$XCODE_SCHEME" \
                -configuration Release \
                -archivePath "$ARCHIVE_PATH" \
                -destination 'generic/platform=iOS' \
                COMPILER_INDEX_STORE_ENABLE=NO \
                DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
                CODE_SIGN_STYLE=Manual \
                PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
                CODE_SIGN_IDENTITY="iPhone Distribution" \
                archive 2>&1 | tee /tmp/xcodebuild_logs/archive.log; then
            echo ""
            echo "=== ARCHIVE FAILED — filtered errors ==="
            grep -E "error:|warning:|note:|Undefined symbol|ld: |Command .* failed" /tmp/xcodebuild_logs/archive.log | tail -n 200 || true
            echo ""
            echo "=== ARCHIVE FAILED — last 500 lines of archive.log ==="
            tail -n 500 /tmp/xcodebuild_logs/archive.log
            exit 1
          fi
          echo "=== Archive OK — exporting IPA ==="
          EXPORT_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$EXPORT_DIR"
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tee /tmp/xcodebuild_logs/export.log

      - name: Print xcodebuild logs
        script: |
          echo "=== xcodebuild logs ==="
          find /tmp/xcodebuild_logs -type f -name "*.log" -maxdepth 2 -print || true
          for f in /tmp/xcodebuild_logs/*.log; do
            [ -f "$f" ] || continue
            echo ""
            echo "===== $f (tail 300) ====="
            tail -n 300 "$f"
          done
          # Fail the workflow if the archive step failed
          if [ -f /tmp/xcodebuild_logs/archive.log ] && grep -qE "\*\* ARCHIVE FAILED \*\*|error:" /tmp/xcodebuild_logs/archive.log && [ ! -f "$CM_BUILD_DIR/build/ios/ipa"/*.ipa ] 2>/dev/null; then
            if ! ls "$CM_BUILD_DIR/build/ios/ipa"/*.ipa >/dev/null 2>&1; then
              echo "No IPA produced — failing workflow."
              exit 1
            fi
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      email:
        recipients:
          - cubanito_com@yahoo.com
        notify:
          success: true
          failure: true
