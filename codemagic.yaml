workflows:
  capacitor_ios_release:
    name: Capacitor iOS Release
    max_build_duration: 120

    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hanging360.app"
        DEVELOPMENT_TEAM: "C427U3735D"
        PROVISIONING_PROFILE_SPECIFIER: "Hanging360"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        MARKETING_VERSION: "0.3"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ~/.cocoapods/repos
        - ios/App/Pods

    scripts:
      - name: Validate toolchain
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Validate signing assets
        script: |
          echo "=== Installed code signing identities ==="
          security find-identity -v -p codesigning || true
          echo "=== Installed provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Install JS dependencies
        script: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
          cd ../..

      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER" || true
          cd ../..

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM PROVISIONING_PROFILE_SPECIFIER=$PROVISIONING_PROFILE_SPECIFIER PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER CODE_SIGN_IDENTITY=Apple\ Distribution" \
            --export-xcargs "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM PROVISIONING_PROFILE_SPECIFIER=$PROVISIONING_PROFILE_SPECIFIER" \
            --verbose

      - name: Print xcodebuild logs
        script: |
          echo "=== xcodebuild logs ==="
          find /tmp/xcodebuild_logs -type f -name "*.log" -maxdepth 2 -print || true
          tail -n 200 /tmp/xcodebuild_logs/*.log || true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      email:
        recipients:
          - cubanito_com@yahoo.com
        notify:
          success: true
          failure: true
