workflows:
  capacitor_ios_release:
    name: Capacitor iOS Release
    max_build_duration: 120

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hanging360.app

      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_VERSION: "0.3"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ~/.cocoapods/repos
        - ios/App/Pods

    scripts:

      - name: Validate toolchain
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Build web
        script: |
          npm run build

      - name: Capacitor Sync
        script: |
          npx cap sync ios

      - name: CocoaPods
        script: |
          cd ios/App
          pod repo update
          pod install
          cd ../..

      - name: Version
        script: |
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION" || true
          agvtool new-version -all "$BUILD_NUMBER" || true
          cd ../..

      - name: Configure signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - cubanito_com@yahoo.com
        notify:
          success: true
          failure: true
