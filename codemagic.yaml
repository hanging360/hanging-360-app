workflows:
  capacitor_ios_release:
    name: Capacitor iOS Release
    max_build_duration: 120

    integrations:
      app_store_connect: Hanging360

    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hanging360.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hanging360.app"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ~/.cocoapods/repos
        - ios/App/Pods

    scripts:
      - name: Validate toolchain
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install JS dependencies
        script: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
          cd ../..

      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER || true
          cd ../..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - build/ios/xcarchive/*.xcarchive

    publishing:
      email:
        recipients:
          - cubanito_com@yahoo.com
        notify:
          success: true
          failure: true
