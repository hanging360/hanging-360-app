workflows:
  capacitor_ios_release:
    name: Capacitor iOS Release
    max_build_duration: 120

    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hanging360.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hanging360.app"
        DEVELOPMENT_TEAM: "C427U3735D"
        MARKETING_VERSION: "0.3"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ~/.cocoapods/repos
        - ios/App/Pods

    scripts:
      - name: Validate toolchain
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Validate signing assets
        script: |
          echo "=== Installed code signing identities ==="
          security find-identity -v -p codesigning || true
          echo "=== Installed provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Install JS dependencies
        script: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
          cd ../..

      - name: Force Bundle ID and version
        script: |
          sed -i '' 's/com.hanging360.tech/com.hanging360.app/g' ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' 's/com.it2fixsupport.pwacapacitorwrapper/com.hanging360.app/g' ios/App/App.xcodeproj/project.pbxproj || true
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION" || true
          agvtool new-version -all "$BUILD_NUMBER" || true
          cd ../..

      - name: Create ExportOptions.plist
        script: |
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>C427U3735D</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint /Users/builder/export_options.plist

      - name: Show code signing settings
        script: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings | egrep "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            --export-options-plist /Users/builder/export_options.plist \
            --verbose

      - name: Print xcodebuild logs
        script: |
          echo "=== xcodebuild logs ==="
          find /tmp/xcodebuild_logs -type f -name "*.log" -maxdepth 2 -print || true
          tail -n 300 /tmp/xcodebuild_logs/*.log || true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      email:
        recipients:
          - cubanito_com@yahoo.com
        notify:
          success: true
          failure: true
